apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-0
  namespace: tom-testing
  annotations:
    description: 'src: (tag = telco-lab|fleet-web) dst: (*) conn: TCP,UDP dst-ports:
      53'
    nsx-id: '1038'
spec:
  podSelector:
    matchExpressions:
    - key: tag__telco-labfleet-web
      operator: Exists
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 53
      protocol: SCTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-16
  namespace: tom-testing
  annotations:
    description: 'src: (tag = telco-lab|fleet-web) dst: (tag = telco-lab|fleet-api)
      conn: All Connections'
    nsx-id: '1048'
spec:
  podSelector:
    matchExpressions:
    - key: tag__telco-labfleet-web
      operator: Exists
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: tag__telco-labfleet-api
          operator: Exists
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-22
  namespace: tom-testing
  annotations:
    description: 'src: (*) dst: (tag = telco-lab|fleet-web) conn: All Connections'
    nsx-id: '1045'
spec:
  podSelector:
    matchExpressions:
    - key: tag__telco-labfleet-web
      operator: Exists
  policyTypes:
  - Ingress
  ingress:
  - {}
